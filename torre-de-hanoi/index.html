<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torre de Hanói</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0f;
      --surface: #18181b;
      --border: rgba(255,255,255,0.07);
      --text: #f0ede8;
      --muted: #6b6b72;
      --accent: #c8f060;
      --accent2: #60c8f0;
      --disk-colors: #60c8f0, #c8f060, #f06090, #c060f0, #f0c060, #60f0c8, #f09060, #a0c0ff;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 2rem 2rem 1rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    header span {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 2rem 2rem;
      gap: 1.25rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 120px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      outline: none;
    }

    .val {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      min-width: 16px;
    }

    .stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-val {
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--accent);
    }

    .canvas-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }

    canvas {
      display: block;
      width: 100%;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 7px 16px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      letter-spacing: 0.03em;
    }
    button:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.3; cursor: default; transform: none; }
    button.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
    button.primary:hover { background: rgba(200,240,96,0.1); }

    #msg {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      min-height: 18px;
      transition: color 0.3s;
    }
    #msg.win { color: var(--accent); }

    footer {
      text-align: center;
      padding: 1rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <h1>Torre de Hanói</h1>
  <span>algoritmo recursivo / visualização interativa</span>
</header>

<main class="main">
  <div class="controls">
    <div class="ctrl-group">
      <label>Discos</label>
      <input type="range" id="disk-slider" min="2" max="8" value="3" step="1" />
      <span class="val" id="disk-count">3</span>
    </div>
    <div class="ctrl-group">
      <label>Velocidade</label>
      <select id="speed">
        <option value="800">lenta</option>
        <option value="350" selected>normal</option>
        <option value="100">rápida</option>
        <option value="18">ultra</option>
      </select>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Movimentos</span>
      <span class="stat-val" id="move-count">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Mínimo</span>
      <span class="stat-val" id="min-moves">7</span>
    </div>
    <div class="stat">
      <span class="stat-label">Progresso</span>
      <span class="stat-val" id="progress">0%</span>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="c"></canvas>
  </div>

  <div class="btn-row">
    <button class="primary" id="btn-solve">resolver</button>
    <button id="btn-step">passo a passo</button>
    <button id="btn-pause" disabled>pausar</button>
    <button id="btn-reset">resetar</button>
  </div>

  <div id="msg">Clique em "resolver" ou mova os discos manualmente clicando e arrastando.</div>
</main>

<footer>Torre de Hanói — solução mínima em 2ⁿ − 1 movimentos</footer>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const COLORS = [
    '#60c8f0','#c8f060','#f06090','#c060f0',
    '#f0c060','#60f0c8','#f09060','#a0c0ff'
  ];

  let numDisks = 3;
  let pegs = [[], [], []];
  let moves = [];
  let moveIdx = 0;
  let isPlaying = false;
  let timer = null;
  let moveCount = 0;
  let dragDisk = null;
  let dragPeg = null;
  let mouseX = 0, mouseY = 0;
  let animFrame = null;

  function init() {
    numDisks = parseInt(document.getElementById('disk-slider').value);
    pegs = [[], [], []];
    for (let i = numDisks; i >= 1; i--) pegs[0].push(i);
    moves = [];
    moveIdx = 0;
    moveCount = 0;
    isPlaying = false;
    dragDisk = null;
    clearTimeout(timer);
    if (animFrame) cancelAnimationFrame(animFrame);
    generateMoves(numDisks, 0, 2, 1);
    updateStats();
    document.getElementById('btn-pause').disabled = true;
    document.getElementById('btn-solve').disabled = false;
    document.getElementById('btn-step').disabled = false;
    const msg = document.getElementById('msg');
    msg.textContent = 'Clique em "resolver" ou mova os discos manualmente.';
    msg.className = '';
    draw();
  }

  function generateMoves(n, from, to, via) {
    if (n === 0) return;
    generateMoves(n - 1, from, via, to);
    moves.push([from, to]);
    generateMoves(n - 1, via, to, from);
  }

  function updateStats() {
    const min = Math.pow(2, numDisks) - 1;
    document.getElementById('move-count').textContent = moveCount;
    document.getElementById('min-moves').textContent = min;
    document.getElementById('progress').textContent = Math.round(moveCount / min * 100) + '%';
  }

  function getLayout() {
    const W = canvas.width;
    const H = canvas.height;
    const pad = W * 0.06;
    const usable = W - pad * 2;
    const pegX = [pad + usable * 0.14, pad + usable * 0.5, pad + usable * 0.86];
    const baseY = H - 28;
    const maxDiskW = usable * 0.27;
    const minDiskW = Math.max(22, usable * 0.05);
    const availH = baseY - 50;
    const diskH = Math.min(24, Math.floor(availH / (numDisks + 1.5)));
    return { W, H, pegX, baseY, maxDiskW, minDiskW, diskH, availH };
  }

  function diskWidth(size, l) {
    return l.minDiskW + (l.maxDiskW - l.minDiskW) * (size - 1) / Math.max(numDisks - 1, 1);
  }

  function draw(anim) {
    const l = getLayout();
    ctx.clearRect(0, 0, l.W, l.H);

    // Base
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.beginPath();
    ctx.roundRect(16, l.baseY, l.W - 32, 8, 4);
    ctx.fill();

    // Peg labels & poles
    const labels = ['A', 'B', 'C'];
    l.pegX.forEach((x, i) => {
      const ph = l.baseY - 24;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.roundRect(x - 5, 28, 10, ph, 5);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.font = '500 13px "DM Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(labels[i], x, 20);
    });

    const skipPeg = anim ? anim.from : -1;
    const skipDisk = anim ? anim.disk : -1;

    pegs.forEach((peg, pi) => {
      peg.forEach((size, si) => {
        if (pi === skipPeg && size === skipDisk && si === peg.length - 1) return;
        drawDisk(l.pegX[pi], l.baseY - (si + 1) * l.diskH, size, l);
      });
    });

    if (anim) {
      const { disk, from, to, t } = anim;
      const fromIdx = pegs[from].indexOf(disk);
      const startY = l.baseY - (fromIdx + 1) * l.diskH;
      const endY = l.baseY - (pegs[to].length + 1) * l.diskH;
      const topY = 44;
      let ax, ay;
      if (t < 0.38) {
        const p = ease(t / 0.38);
        ax = l.pegX[from];
        ay = startY + (topY - startY) * p;
      } else if (t < 0.62) {
        const p = ease((t - 0.38) / 0.24);
        ax = l.pegX[from] + (l.pegX[to] - l.pegX[from]) * p;
        ay = topY;
      } else {
        const p = ease((t - 0.62) / 0.38);
        ax = l.pegX[to];
        ay = topY + (endY - topY) * p;
      }
      drawDisk(ax, ay, disk, l);
    }

    if (dragDisk !== null) {
      drawDisk(mouseX, mouseY, dragDisk, l);
    }
  }

  function ease(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

  function drawDisk(cx, y, size, l) {
    const w = diskWidth(size, l);
    const h = l.diskH - 3;
    const x = cx - w / 2;
    const color = COLORS[(size - 1) % COLORS.length];
    ctx.fillStyle = color + '22';
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, h / 2);
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = '500 11px "DM Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(size, cx, y + h / 2 + 4);
  }

  function animateMove(from, to, disk, cb) {
    const start = performance.now();
    const duration = parseInt(document.getElementById('speed').value);
    function step(now) {
      const t = Math.min((now - start) / duration, 1);
      draw({ disk, from, to, t });
      if (t < 1) animFrame = requestAnimationFrame(step);
      else cb();
    }
    animFrame = requestAnimationFrame(step);
  }

  function applyMove(from, to) {
    const disk = pegs[from].pop();
    pegs[to].push(disk);
    moveCount++;
    updateStats();
    return disk;
  }

  function playNext() {
    if (!isPlaying || moveIdx >= moves.length) {
      isPlaying = false;
      document.getElementById('btn-pause').disabled = true;
      if (moveIdx >= moves.length) {
        document.getElementById('msg').textContent = '✓ Resolvido em ' + moveCount + ' movimentos!';
        document.getElementById('msg').className = 'win';
        document.getElementById('btn-solve').disabled = true;
        document.getElementById('btn-step').disabled = true;
      }
      draw();
      return;
    }
    const [from, to] = moves[moveIdx];
    const disk = pegs[from][pegs[from].length - 1];
    animateMove(from, to, disk, () => {
      applyMove(from, to);
      draw();
      moveIdx++;
      timer = setTimeout(playNext, 20);
    });
  }

  function solve() {
    if (isPlaying) return;
    isPlaying = true;
    document.getElementById('btn-pause').disabled = false;
    document.getElementById('btn-solve').disabled = true;
    document.getElementById('btn-step').disabled = true;
    document.getElementById('msg').textContent = 'Resolvendo…';
    playNext();
  }

  function stepOnce() {
    if (isPlaying || moveIdx >= moves.length) return;
    const [from, to] = moves[moveIdx];
    const disk = pegs[from][pegs[from].length - 1];
    document.getElementById('btn-step').disabled = true;
    document.getElementById('btn-solve').disabled = true;
    animateMove(from, to, disk, () => {
      applyMove(from, to);
      draw();
      moveIdx++;
      const done = moveIdx >= moves.length;
      document.getElementById('btn-step').disabled = done;
      document.getElementById('btn-solve').disabled = done;
      const msg = document.getElementById('msg');
      if (done) {
        msg.textContent = '✓ Resolvido em ' + moveCount + ' movimentos!';
        msg.className = 'win';
      } else {
        msg.textContent = 'Movimento ' + moveIdx + ' de ' + moves.length;
        msg.className = '';
      }
    });
  }

  function nearestPeg(x) {
    const l = getLayout();
    let best = 0, bestD = Infinity;
    l.pegX.forEach((px, i) => {
      const d = Math.abs(x - px);
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }

  function toCanvas(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return {
      x: (src.clientX - rect.left) * scaleX,
      y: (src.clientY - rect.top) * scaleY
    };
  }

  function onDown(e) {
    if (isPlaying) return;
    const { x, y } = toCanvas(e);
    const pi = nearestPeg(x);
    if (pegs[pi].length === 0) return;
    dragDisk = pegs[pi][pegs[pi].length - 1];
    dragPeg = pi;
    pegs[pi].pop();
    mouseX = x; mouseY = y;
    draw();
  }

  function onMove(e) {
    if (dragDisk === null) return;
    e.preventDefault();
    const { x, y } = toCanvas(e);
    mouseX = x; mouseY = y;
    draw();
  }

  function onUp(e) {
    if (dragDisk === null) return;
    const { x } = toCanvas(e);
    const pi = nearestPeg(x);
    const msg = document.getElementById('msg');
    if (pi !== dragPeg && (pegs[pi].length === 0 || pegs[pi][pegs[pi].length - 1] > dragDisk)) {
      pegs[pi].push(dragDisk);
      moveCount++;
      updateStats();
      msg.className = '';
      if (pegs[2].length === numDisks) {
        msg.textContent = '✓ Parabéns! Resolvido em ' + moveCount + ' movimentos!';
        msg.className = 'win';
      } else {
        msg.textContent = '';
      }
    } else {
      pegs[dragPeg].push(dragDisk);
      msg.textContent = 'Movimento inválido — disco maior não pode ficar sobre menor.';
      msg.className = '';
    }
    dragDisk = null; dragPeg = null;
    draw();
  }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: true });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);

  document.getElementById('disk-slider').addEventListener('input', e => {
    document.getElementById('disk-count').textContent = e.target.value;
    init();
  });
  document.getElementById('btn-solve').addEventListener('click', () => { moveIdx = 0; solve(); });
  document.getElementById('btn-step').addEventListener('click', stepOnce);
  document.getElementById('btn-pause').addEventListener('click', () => {
    isPlaying = false;
    clearTimeout(timer);
    document.getElementById('btn-pause').disabled = true;
    document.getElementById('btn-solve').disabled = false;
    document.getElementById('btn-step').disabled = false;
    document.getElementById('msg').textContent = 'Pausado.';
  });
  document.getElementById('btn-reset').addEventListener('click', init);

  function resize() {
    const w = canvas.parentElement.clientWidth;
    canvas.width = w;
    canvas.height = Math.max(200, Math.min(320, w * 0.42));
    draw();
  }

  window.addEventListener('resize', resize);
  resize();
  init();
})();
</script>
</body>
</html>
